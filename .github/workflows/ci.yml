name: AI Private Office checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: office_ci
          POSTGRES_PASSWORD: office_ci_password
          POSTGRES_DB: office_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_ci -d office_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://office_ci:office_ci_password@localhost:5432/office_ci
      CEO_PASSWORD: test-password-only
      SESSION_SECRET: a-test-session-secret-longer-than-32-characters
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r requirements.txt 'httpx>=0.27,<1'
      - name: Python syntax
        run: python -m compileall -q backend tests
      - name: JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('frontend/index.html').read_text(); Path('/tmp/office.js').write_text(html.split('<script>')[-1].split('</script>')[0])"
          node --check /tmp/office.js
      - name: API startup and full feature integration tests
        env:
          CEO_PASSWORD: test-password-only
          SESSION_SECRET: a-test-session-secret-longer-than-32-characters
          COOKIE_SECURE: 'false'
        run: |
          python -c "from backend.main import app; assert app is not None"
          python -m unittest discover -s tests -v
      - name: PostgreSQL backup and isolated restore rehearsal
        env:
          CI: 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          python scripts/backup_restore_drill.py
