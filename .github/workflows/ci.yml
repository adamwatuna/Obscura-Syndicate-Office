name: AI Private Office checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend tests
      - name: JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('frontend/index.html').read_text(); Path('/tmp/office.js').write_text(html.split('<script>')[-1].split('</script>')[0])"
          node --check /tmp/office.js
      - name: API startup and plan validation
        env:
          CEO_PASSWORD: test-password-only
          SESSION_SECRET: a-test-session-secret-longer-than-32-characters
          COOKIE_SECURE: 'false'
        run: |
          python -c "from backend.main import app; assert app is not None"
          python -m unittest discover -s tests -v
